name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\build.ps1 -Python python
      - name: Test pagination, audio and transfer recovery with the verified media tools
        run: |
          python -m unittest discover -s tests -p test_pagination.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_music.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_transfer.py -v
      - name: Install and smoke test
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $installDir = Join-Path $env:RUNNER_TEMP "YT Downloader"
          $setupArgs = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
                       ('/DIR="' + $installDir + '"')
          $setup = Start-Process -FilePath ".\dist\YTDownloader-Setup.exe" -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $shell = New-Object -ComObject WScript.Shell
          $exe = Join-Path $installDir "YTDownloader.exe"
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath("Programs")) "YT Downloader\YT Downloader.lnk")
            (Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "YT Downloader.lnk")
          )
          foreach ($link in $shortcuts) {
            if (-not (Test-Path -LiteralPath $link) -or $shell.CreateShortcut($link).TargetPath -ne $exe) {
              throw "Missing or invalid installed shortcut: $link"
            }
          }
          $data = Join-Path $env:RUNNER_TEMP "YT Downloader test"
          $smokeArgs = "--smoke-test", ('"' + $data + '"')
          $app = Start-Process -FilePath $exe -ArgumentList $smokeArgs -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode -ne 0) {
            if (Test-Path "$data\app.log") { Get-Content "$data\app.log" }
            exit $app.ExitCode
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/YTDownloader-Setup.exe
            dist/YTDownloader-Setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Read the previous published version
        id: previous
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -SkipHttpErrorCheck
          if ($release.tag_name -eq $env:GITHUB_REF_NAME) {
            $version = [Version]($env:GITHUB_REF_NAME.TrimStart('v'))
            $release = (Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=20") |
              Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' -and
                             [Version]($_.tag_name.TrimStart('v')) -lt $version } |
              Sort-Object { [Version]($_.tag_name.TrimStart('v')) } -Descending |
              Select-Object -First 1
          }
          if ($release.tag_name -and $release.tag_name -ne $env:GITHUB_REF_NAME) {
            "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from yt_downloader import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match app version." }
          $published = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" -SkipHttpErrorCheck
          if ($published.tag_name -eq $env:GITHUB_REF_NAME -and -not $published.draft) {
            if ($published.assets.name -notcontains 'YTDownloader-Setup.exe' -or
                $published.assets.name -notcontains 'YTDownloader-Setup.exe.sha256') {
              throw "The existing release is missing installer assets."
            }
            Write-Host "The release is already published."
            return
          }
          gh release create $env:GITHUB_REF_NAME dist/YTDownloader-Setup.exe dist/YTDownloader-Setup.exe.sha256 --verify-tag --generate-notes --latest
      - name: Verify automatic upgrade and restart
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: python -X utf8 packaging/verify_upgrade.py $env:PREVIOUS_TAG $env:GITHUB_REF_NAME
