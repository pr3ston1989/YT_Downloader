name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\build.ps1 -Python python
      - name: Test pagination and audio with the verified media tools
        run: |
          python -m unittest discover -s tests -p test_pagination.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_music.py -v
      - name: Install and smoke test
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $installDir = Join-Path $env:RUNNER_TEMP "YT Downloader"
          $setupArgs = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/NOICONS",
                       ('/DIR="' + $installDir + '"')
          $setup = Start-Process -FilePath ".\dist\YTDownloader-Setup.exe" -ArgumentList $setupArgs -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $data = Join-Path $env:RUNNER_TEMP "YT Downloader test"
          $smokeArgs = "--smoke-test", ('"' + $data + '"')
          $app = Start-Process -FilePath (Join-Path $installDir "YTDownloader.exe") -ArgumentList $smokeArgs -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode -ne 0) {
            if (Test-Path "$data\app.log") { Get-Content "$data\app.log" }
            exit $app.ExitCode
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/YTDownloader-Setup.exe
            dist/YTDownloader-Setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Read the previous published version
        id: previous
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -SkipHttpErrorCheck
          if ($release.tag_name -and $release.tag_name -ne $env:GITHUB_REF_NAME) {
            "tag=$($release.tag_name)" >> $env:GITHUB_OUTPUT
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from yt_downloader import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match app version." }
          gh release create $env:GITHUB_REF_NAME dist/YTDownloader-Setup.exe dist/YTDownloader-Setup.exe.sha256 --verify-tag --generate-notes --latest
      - name: Verify automatic upgrade and restart
        if: steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: python -X utf8 packaging/verify_upgrade.py $env:PREVIOUS_TAG $env:GITHUB_REF_NAME
