name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\build.ps1 -Python python
      - name: Smoke test frozen app
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $data = Join-Path (Get-Location) ".test-data\ci"
          $smokeArgs = "--smoke-test", ('"' + $data + '"')
          $app = Start-Process -FilePath ".\dist\YTDownloader\YTDownloader.exe" -ArgumentList $smokeArgs -Wait -PassThru -WindowStyle Hidden
          if ($app.ExitCode -ne 0) {
            if (Test-Path "$data\app.log") { Get-Content "$data\app.log" }
            exit $app.ExitCode
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/YTDownloader-Setup.exe
            dist/YTDownloader-Setup.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from yt_downloader import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match app version." }
          gh release create $env:GITHUB_REF_NAME dist/YTDownloader-Setup.exe dist/YTDownloader-Setup.exe.sha256 --verify-tag --generate-notes --latest
